name: arceus-platform

x-jdbc-env: &jdbc-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: postgres
  DB_PASSWORD: postgres

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ""

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_VHOST: /

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arceus_auth
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    environment:
      <<: [*jdbc-env, *redis-env, *rabbitmq-env]
      DB_NAME: arceus_auth
      JWT_SECRET: demo-jwt-secret-change-me-1234567890abcdef
      GMAIL_USERNAME: demo@example.com
      GMAIL_APP_PASSWORD: demo-app-password
      GOOGLE_CLIENT_ID: demo-google-client-id
      GOOGLE_CLIENT_SECRET: demo-google-client-secret
      GITHUB_CLIENT_ID: demo-github-client-id
      GITHUB_CLIENT_SECRET: demo-github-client-secret
      OAUTH2_REDIRECT_URI: http://localhost:3000/oauth2/callback
      TWOFACTOR_API_KEY: demo-2factor-key
      SUPER_ADMIN_EMAIL: admin@arceus.local
      SUPER_ADMIN_PASSWORD: ChangeMe123!
      AUTH_INTERNAL_API_TOKEN: demo-auth-internal-token
      AUTH_API_KEY_ENCRYPTION_KEY: n9CEuc5mGgzt6rNyE1oqVeUf0zBv/sKMmx/34Azd56E=
      AUTH_CALLBACK_BASE_URL: http://auth-service:8081
    ports:
      - "8081:8081"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: [*jdbc-env, *redis-env, *rabbitmq-env]
      NOTIFICATION_DB_NAME: arceus_notification
      GMAIL_USERNAME: demo@example.com
      GMAIL_APP_PASSWORD: demo-app-password
      TWOFACTOR_API_KEY: demo-2factor-key
      NOTIFICATION_INTERNAL_API_TOKEN: demo-notification-internal-token
      NOTIFICATION_CALLBACK_BASE_URL: http://notification-service:8082
      DEPLOYMENT_ALERT_EMAIL: deploy-alerts@arceus.local
    ports:
      - "8082:8082"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  ratelimit-service:
    build:
      context: .
      dockerfile: services/ratelimit-service/Dockerfile
    environment:
      <<: [*redis-env]
    ports:
      - "8084:8084"
    depends_on:
      redis: { condition: service_healthy }

  cache-service:
    build:
      context: .
      dockerfile: services/cache-service/Dockerfile
    environment:
      <<: [*redis-env]
      CACHE_INTERNAL_API_TOKEN: demo-cache-internal-token
      CACHE_CALLBACK_BASE_URL: http://cache-service:8085
    ports:
      - "8085:8085"
    depends_on:
      redis: { condition: service_healthy }

  scheduler-service:
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    environment:
      <<: [*jdbc-env, *rabbitmq-env]
      SCHEDULER_DB_NAME: arceus_scheduler
      SCHEDULER_INTERNAL_API_TOKEN: demo-scheduler-internal-token
    ports:
      - "8086:8086"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  feature-flag-service:
    build:
      context: .
      dockerfile: services/feature-flag-service/Dockerfile
    environment:
      <<: [*jdbc-env, *redis-env, *rabbitmq-env]
      FEATURE_FLAG_DB_NAME: arceus_feature_flag
      FEATURE_FLAG_INTERNAL_API_TOKEN: demo-feature-flag-internal-token
      FEATURE_FLAG_CALLBACK_BASE_URL: http://feature-flag-service:8087
    ports:
      - "8087:8087"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      scheduler-service: { condition: service_started }

  monitoring-service:
    build:
      context: .
      dockerfile: services/monitoring-service/Dockerfile
    environment:
      <<: [*jdbc-env, *redis-env, *rabbitmq-env]
      MONITORING_DB_NAME: arceus_monitoring
      MONITORING_INTERNAL_API_TOKEN: demo-monitoring-internal-token
      GATEWAY_BASE_URL: http://gateway-service:8090
      AUTH_BASE_URL: http://auth-service:8081
      NOTIFICATION_BASE_URL: http://notification-service:8082
      RATELIMIT_BASE_URL: http://ratelimit-service:8084
      CACHE_BASE_URL: http://cache-service:8085
      SCHEDULER_BASE_URL: http://scheduler-service:8086
      FEATURE_FLAG_BASE_URL: http://feature-flag-service:8087
    ports:
      - "8088:8088"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  organization-service:
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    environment:
      <<: [*jdbc-env, *rabbitmq-env]
      ORGANIZATION_DB_NAME: arceus_organization
      ORGANIZATION_SECRETS_KEK: MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3A=
      ARCEUS_GATEWAY_BASE_URL: http://localhost:8090
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9081
      NOTIFICATION_GRPC_HOST: notification-service
      NOTIFICATION_GRPC_PORT: 9082
      CACHE_GRPC_HOST: cache-service
      CACHE_GRPC_PORT: 9085
      SCHEDULER_GRPC_HOST: scheduler-service
      SCHEDULER_GRPC_PORT: 9086
      FEATURE_FLAG_GRPC_HOST: feature-flag-service
      FEATURE_FLAG_GRPC_PORT: 9087
      SCHEDULER_INTERNAL_API_TOKEN: demo-scheduler-internal-token
      FEATURE_FLAG_INTERNAL_API_TOKEN: demo-feature-flag-internal-token
    ports:
      - "8091:8091"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_started }
      notification-service: { condition: service_started }
      cache-service: { condition: service_started }
      scheduler-service: { condition: service_started }
      feature-flag-service: { condition: service_started }

  gateway-service:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    environment:
      <<: [*rabbitmq-env]
      JWT_SECRET: demo-jwt-secret-change-me-1234567890abcdef
      GATEWAY_PORT: 8090
      GATEWAY_RATE_LIMIT: 100
      GATEWAY_RATE_LIMIT_WINDOW_SECONDS: 60
      GATEWAY_FEATURE_FLAG_ENVIRONMENT: PRODUCTION
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4300
      FEATURE_FLAG_INTERNAL_API_TOKEN: demo-feature-flag-internal-token
      SCHEDULER_INTERNAL_API_TOKEN: demo-scheduler-internal-token
      MONITORING_INTERNAL_API_TOKEN: demo-monitoring-internal-token
      AUTH_GRPC_HOST: auth-service
      AUTH_GRPC_PORT: 9081
      NOTIFICATION_GRPC_HOST: notification-service
      NOTIFICATION_GRPC_PORT: 9082
      RATELIMIT_GRPC_HOST: ratelimit-service
      RATELIMIT_GRPC_PORT: 9084
      CACHE_GRPC_HOST: cache-service
      CACHE_GRPC_PORT: 9085
      SCHEDULER_GRPC_HOST: scheduler-service
      SCHEDULER_GRPC_PORT: 9086
      FEATURE_FLAG_GRPC_HOST: feature-flag-service
      FEATURE_FLAG_GRPC_PORT: 9087
      MONITORING_GRPC_HOST: monitoring-service
      MONITORING_GRPC_PORT: 9088
      ORGANIZATION_GRPC_HOST: organization-service
      ORGANIZATION_GRPC_PORT: 9090
    ports:
      - "8090:8090"
    depends_on:
      rabbitmq: { condition: service_healthy }
      auth-service: { condition: service_started }
      notification-service: { condition: service_started }
      ratelimit-service: { condition: service_started }
      scheduler-service: { condition: service_started }
      feature-flag-service: { condition: service_started }
      monitoring-service: { condition: service_started }
      organization-service: { condition: service_started }
      cache-service: { condition: service_started }

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8090
    ports:
      - "3000:3000"
    depends_on:
      gateway-service: { condition: service_started }

volumes:
  pgdata:
