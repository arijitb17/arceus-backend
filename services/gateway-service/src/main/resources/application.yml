server:
  port: ${GATEWAY_PORT:8090}

grpc:
  client:
    auth:
      address: static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9081}
      negotiation-type: plaintext
    notification:
      address: static://${NOTIFICATION_GRPC_HOST:localhost}:${NOTIFICATION_GRPC_PORT:9082}
      negotiation-type: plaintext
    ratelimit:
      address: static://${RATELIMIT_GRPC_HOST:localhost}:${RATELIMIT_GRPC_PORT:9084}
      negotiation-type: plaintext
    # Used by RouteFlagGatewayClient's per-route kill-switch check, and
    # reused below for FeatureFlagGatewayServiceGrpc (same host:port, just
    # a different stub type on the same channel).
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext
    monitoring:
      address: static://${MONITORING_GRPC_HOST:localhost}:${MONITORING_GRPC_PORT:9088}
      negotiation-type: plaintext
    scheduler:
      address: static://${SCHEDULER_GRPC_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    cache:
      address: static://${CACHE_GRPC_HOST:localhost}:${CACHE_GRPC_PORT:9085}
      negotiation-type: plaintext
    organization:
      address: static://${ORGANIZATION_GRPC_HOST:localhost}:${ORGANIZATION_GRPC_PORT:9090}
      negotiation-type: plaintext

spring:
  application:
    name: gateway-service
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        # 'metrics' + show-details below are what let monitoring-service's
        # ServiceHealthCollector/ServiceMetricsCollector see this service's
        # component breakdown and JVM/CPU/request metrics.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# --- Arceus Gateway specific configuration -----------------------------
arceus:
  gateway:
    # Same signing secret auth-service uses to issue access tokens - the
    # Gateway only ever verifies, it never issues or refreshes tokens itself.
    jwt:
      secret: ${JWT_SECRET}

    # RouteFlagGatewayClient's per-route kill-switch - see its Javadoc and
    # ProxyController.Route for how a route maps to a flag key.
    feature-flags:
      environment: ${GATEWAY_FEATURE_FLAG_ENVIRONMENT:PRODUCTION}

    # x-internal-token the Gateway must present when it calls
    # monitoring-service/scheduler-service/feature-flag-service's gRPC API
    # (their GrpcAuthInterceptor is global - it also guards their Forward
    # RPC, not just their domain-specific ones) - see config.GrpcClientConfig.
    # Each value must match that target service's own
    # arceus.<service>.internal.api-token exactly.
    grpc-clients:
      feature-flag-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}
      monitoring-token: ${MONITORING_INTERNAL_API_TOKEN:changeme-monitoring-internal-token}
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}

    # Endpoints that don't require a valid access token. Matched as prefixes
    # against the incoming request path (before the /api/<service> segment
    # is stripped). Keep this in sync with what each service's own security
    # config also treats as public - the Gateway check is a fast first line
    # of defense, not a replacement for it.
    public-paths:
      - /api/auth/register
      - /api/auth/verify-email
      - /api/auth/verify-phone
      - /api/auth/login
      - /api/auth/verify-login-otp
      - /api/auth/forgot-password
      - /api/auth/verify-forgot-password-otp
      - /api/auth/reset-password
      - /api/auth/refresh
      - /api/auth/oauth2/exchange
      - /actuator/health
      - /actuator/health/**
      # monitoring-service's ServiceHealthCollector calls this unauthenticated
      # (it has no user JWT to send) to read the Gateway's own build version -
      # see fetchVersion(). Without this, every poll gets a 401 here and the
      # dashboard shows "unknown" for gateway-service specifically.
      - /actuator/info

    # Coarse, edge-level rate limit applied to every protected request
    # before it's forwarded to a service, on top of (not instead of) each
    # service's own fine-grained @RateLimited rules.
    rate-limit:
      limit: ${GATEWAY_RATE_LIMIT:100}
      window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}

    # Exact origins allowed to call this API from a browser with
    # credentials (Authorization header). Empty by default - nothing is
    # allowed cross-origin until this is set. Comma-separated env var,
    # split into a list here.
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.gatewayservice: ${LOG_LEVEL_GATEWAY_SERVICE:INFO}
