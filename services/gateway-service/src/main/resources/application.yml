server:
  port: ${GATEWAY_PORT:8090}

grpc:
  client:
    auth:
      address: static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9081}
      negotiation-type: plaintext
    notification:
      address: static://${NOTIFICATION_GRPC_HOST:localhost}:${NOTIFICATION_GRPC_PORT:9082}
      negotiation-type: plaintext
    ratelimit:
      address: static://${RATELIMIT_GRPC_HOST:localhost}:${RATELIMIT_GRPC_PORT:9084}
      negotiation-type: plaintext
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext
    monitoring:
      address: static://${MONITORING_GRPC_HOST:localhost}:${MONITORING_GRPC_PORT:9088}
      negotiation-type: plaintext
    scheduler:
      address: static://${SCHEDULER_GRPC_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    cache:
      address: static://${CACHE_GRPC_HOST:localhost}:${CACHE_GRPC_PORT:9085}
      negotiation-type: plaintext
    organization:
      address: static://${ORGANIZATION_GRPC_HOST:localhost}:${ORGANIZATION_GRPC_PORT:9090}
      negotiation-type: plaintext

spring:
  application:
    name: gateway-service
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

arceus:
  gateway:
    jwt:
      secret: ${JWT_SECRET}

    feature-flags:
      environment: ${GATEWAY_FEATURE_FLAG_ENVIRONMENT:PRODUCTION}

    grpc-clients:
      feature-flag-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}
      monitoring-token: ${MONITORING_INTERNAL_API_TOKEN:changeme-monitoring-internal-token}
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}

    public-paths:
      - /api/auth/register
      - /api/auth/verify-email
      - /api/auth/verify-phone
      - /api/auth/login
      - /api/auth/verify-login-otp
      - /api/auth/forgot-password
      - /api/auth/verify-forgot-password-otp
      - /api/auth/reset-password
      - /api/auth/refresh
      - /api/auth/oauth2/exchange
      - /actuator/health
      - /actuator/health/**
      - /actuator/info

    rate-limit:
      limit: ${GATEWAY_RATE_LIMIT:100}
      window-seconds: ${GATEWAY_RATE_LIMIT_WINDOW_SECONDS:60}

    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.gatewayservice: ${LOG_LEVEL_GATEWAY_SERVICE:INFO}
