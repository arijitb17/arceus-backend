server:
  port: 8081

grpc:
  server:
    port: ${AUTH_GRPC_PORT:9081}
  client:
    scheduler:
      address: static://${SCHEDULER_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext
    organization:
      address: static://${ORGANIZATION_GRPC_HOST:localhost}:${ORGANIZATION_GRPC_PORT:9090}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

arceus:
  auth:
    api-key:
      encryption-key: ${AUTH_API_KEY_ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

app:
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    name: ${SUPER_ADMIN_NAME:Super Admin}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
    exchange-code-expiration-seconds: ${OAUTH2_EXCHANGE_CODE_EXPIRATION_SECONDS:60}
  cors:
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
  internal:
    api-token: ${AUTH_INTERNAL_API_TOKEN:changeme-auth-internal-token}
    callback-base-url: ${AUTH_CALLBACK_BASE_URL:http://localhost:8081}
  scheduling:
    session-cleanup-interval-ms: ${AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
    scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}
  feature-flags:
    environment: ${AUTH_FEATURE_FLAG_ENVIRONMENT:PRODUCTION}
    token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}
otp:
  expiration-minutes: 5
  reset-token-expiration-minutes: 10

sms:
  twofactor:
    api-key: ${TWOFACTOR_API_KEY}
    base-url: https://2factor.in/API/V1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.authservice: ${LOG_LEVEL_AUTH_SERVICE:INFO}
    org.springframework.security: INFO
