server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables from your entities - fine for dev,
      # switch to 'validate' + a migration tool (Flyway) before production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

app:
  oauth2:
    # Where the browser lands after a successful Google/GitHub login, with
    # ?accessToken=...&refreshToken=... appended. Point this at your frontend
    # once you have one; for now you can just watch it in the browser URL bar.
    redirect-uri: ${OAUTH2_REDIRECT_URI}
otp:
  expiration-minutes: 5
  reset-token-expiration-minutes: 10

sms:
  twofactor:
    api-key: ${TWOFACTOR_API_KEY}
    base-url: https://2factor.in/API/V1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.arijit.authservice: DEBUG
    org.springframework.security: INFO
