server:
  port: 8081

grpc:
  server:
    port: ${AUTH_GRPC_PORT:9081}

spring:
  autoconfigure:
    exclude:
      # net.devh's grpc-server starter auto-wires gRPC-level authentication
      # the moment Spring Security is on the classpath, which this service
      # doesn't use (its Spring Security setup is for the REST/JWT layer
      # only). Without this, startup fails looking for a
      # GrpcAuthenticationReader bean we have no reason to define.
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables from your entities - fine for dev,
      # switch to 'validate' + a migration tool (Flyway) before production
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

app:
  super-admin:
    # Opt-in: leave both unset (the default) and SuperAdminBootstrap does
    # nothing. Set both to seed exactly one ROLE_ADMIN account on first
    # startup - see SuperAdminBootstrap's javadoc for why it's safe to
    # leave these set across restarts (it never touches an existing account).
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    name: ${SUPER_ADMIN_NAME:Super Admin}
  oauth2:
    # Where the browser lands after a successful Google/GitHub login, with
    # ?code=<one-time-code> appended. The frontend POSTs that code to
    # /api/auth/oauth2/exchange to get real tokens back in a response body -
    # tokens are never put directly in this redirect URL (browser history +
    # server access logs would otherwise capture them).
    redirect-uri: ${OAUTH2_REDIRECT_URI}
    exchange-code-expiration-seconds: ${OAUTH2_EXCHANGE_CODE_EXPIRATION_SECONDS:60}
  cors:
    # Exact origins allowed to call this service directly with credentials
    # (relevant mainly for the OAuth2 redirect flow, which isn't proxied
    # through the Gateway). Comma-separated; empty means nothing is allowed.
    allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:}
otp:
  expiration-minutes: 5
  reset-token-expiration-minutes: 10

sms:
  twofactor:
    api-key: ${TWOFACTOR_API_KEY}
    base-url: https://2factor.in/API/V1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 'metrics' + show-details below are what let monitoring-service's
        # ServiceHealthCollector/ServiceMetricsCollector see this service's
        # db/redis/rabbit component breakdown and JVM/CPU/request metrics -
        # see monitoring-service's application.yml for the polling side.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.authservice: ${LOG_LEVEL_AUTH_SERVICE:INFO}
    org.springframework.security: INFO
