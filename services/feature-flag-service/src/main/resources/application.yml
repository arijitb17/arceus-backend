server:
  port: ${FEATURE_FLAG_PORT:8087}

grpc:
  server:
    port: ${FEATURE_FLAG_GRPC_PORT:9087}
  client:
    scheduler:
      address: static://${SCHEDULER_GRPC_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    cache:
      address: static://${CACHE_GRPC_HOST:localhost}:${CACHE_GRPC_PORT:9085}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: feature-flag-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${FEATURE_FLAG_DB_NAME:arceus_feature_flag}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

arceus:
  feature-flag:
    cache:
      enabled: ${FEATURE_FLAG_CACHE_ENABLED:true}
      ttl-seconds: ${FEATURE_FLAG_CACHE_TTL_SECONDS:60}

    internal:
      api-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}

    scheduling:
      enabled: ${FEATURE_FLAG_SCHEDULING_ENABLED:true}
      callback-base-url: ${FEATURE_FLAG_CALLBACK_BASE_URL:http://localhost:8087}

    grpc-clients:
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.featureflagservice: ${LOG_LEVEL_FEATURE_FLAG_SERVICE:INFO}
