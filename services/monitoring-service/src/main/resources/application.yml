server:
  port: ${MONITORING_PORT:8088}

grpc:
  server:
    port: ${MONITORING_GRPC_PORT:9088}
  client:
    organization:
      address: static://${ORGANIZATION_GRPC_HOST:localhost}:${ORGANIZATION_GRPC_PORT:9090}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: monitoring-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${MONITORING_DB_NAME:arceus_monitoring}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

arceus:
  monitoring:
    internal:
      api-token: ${MONITORING_INTERNAL_API_TOKEN:changeme-monitoring-internal-token}

    polling:
      interval-ms: ${MONITORING_POLLING_INTERVAL_MS:15000}
      http-timeout-ms: ${MONITORING_POLLING_TIMEOUT_MS:2000}

    thresholds:
      cpu-percent: ${MONITORING_THRESHOLD_CPU_PERCENT:80}
      memory-percent: ${MONITORING_THRESHOLD_MEMORY_PERCENT:85}
      error-rate-percent: ${MONITORING_THRESHOLD_ERROR_RATE_PERCENT:5}
      response-time-ms: ${MONITORING_THRESHOLD_RESPONSE_TIME_MS:1000}

    history:
      retention-days: ${MONITORING_HISTORY_RETENTION_DAYS:30}
      cleanup-cron: ${MONITORING_HISTORY_CLEANUP_CRON:0 30 3 * * *}

    targets:
      gateway-service:
        base-url: ${GATEWAY_BASE_URL:http://localhost:8090}
        grpc-host: ${GATEWAY_GRPC_HOST:}
        grpc-port: ${GATEWAY_GRPC_PORT:0}
      auth-service:
        base-url: ${AUTH_BASE_URL:http://localhost:8081}
        grpc-host: ${AUTH_GRPC_HOST:localhost}
        grpc-port: ${AUTH_GRPC_PORT:9081}
      notification-service:
        base-url: ${NOTIFICATION_BASE_URL:http://localhost:8082}
        grpc-host: ${NOTIFICATION_GRPC_HOST:localhost}
        grpc-port: ${NOTIFICATION_GRPC_PORT:9082}
      ratelimit-service:
        base-url: ${RATELIMIT_BASE_URL:http://localhost:8084}
        grpc-host: ${RATELIMIT_GRPC_HOST:localhost}
        grpc-port: ${RATELIMIT_GRPC_PORT:9084}
      cache-service:
        base-url: ${CACHE_BASE_URL:http://localhost:8085}
        grpc-host: ${CACHE_GRPC_HOST:localhost}
        grpc-port: ${CACHE_GRPC_PORT:9085}
      scheduler-service:
        base-url: ${SCHEDULER_BASE_URL:http://localhost:8086}
        grpc-host: ${SCHEDULER_GRPC_HOST:localhost}
        grpc-port: ${SCHEDULER_GRPC_PORT:9086}
      feature-flag-service:
        base-url: ${FEATURE_FLAG_BASE_URL:http://localhost:8087}
        grpc-host: ${FEATURE_FLAG_GRPC_HOST:localhost}
        grpc-port: ${FEATURE_FLAG_GRPC_PORT:9087}
      organization-service:
        base-url: ${ORGANIZATION_BASE_URL:http://localhost:8091}
        grpc-host: ${ORGANIZATION_GRPC_HOST:localhost}
        grpc-port: ${ORGANIZATION_GRPC_PORT:9090}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.monitoringservice: ${LOG_LEVEL_MONITORING_SERVICE:INFO}
