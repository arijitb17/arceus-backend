server:
  port: 8083

grpc:
  server:
    port: ${AUDIT_GRPC_PORT:9083}

spring:
  autoconfigure:
    exclude:
      # See auth-service's application.yml for why: Spring Security here is
      # for the REST layer only, not gRPC.
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${AUDIT_DB_NAME:arceus_audit}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # fine for pre-release dev; move to Flyway + validate before v1.0.0
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        # After retry is exhausted, reject without requeueing so the
        # message dead-letters (see RabbitMQConfig's DLQ wiring) instead of
        # looping through this same consumer forever.
        default-requeue-rejected: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    # Appends the correlation id (set by CorrelationIdFilter) right after
    # the log level on every line, using Spring Boot's default console
    # appender - no custom logback.xml needed. Same property, same key
    # name, in every service, so a `grep correlationId=<id>` across all
    # five services' logs reconstructs one request's full trace.
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.auditservice: ${LOG_LEVEL_AUDIT_SERVICE:INFO}
