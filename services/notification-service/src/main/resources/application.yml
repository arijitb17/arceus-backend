server:
  port: 8082

grpc:
  server:
    port: ${NOTIFICATION_GRPC_PORT:9082}
  client:
    # Used by scheduler.RetryJobRegistrar to register the recurring
    # notification-retry job - see NotificationRetryScheduler's Javadoc.
    scheduler:
      address: static://${SCHEDULER_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    # Used by featureflag.ChannelFlagGateService to gate per-channel sending behind a flag.
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      # See auth-service's application.yml for why: Spring Security here is
      # for the REST layer only, not gRPC.
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${NOTIFICATION_DB_NAME:arceus_notification}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # fine for pre-release dev; move to Flyway + validate before v1.0.0
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

otp:
  expiration-minutes: 5

sms:
  twofactor:
    api-key: ${TWOFACTOR_API_KEY}
    base-url: https://2factor.in/API/V1

notification:
  # Retry policy for the generic /notifications pipeline (separate from the
  # best-effort OTP consumer above, which has no retry yet).
  max-attempts: 5
  retry-backoff-seconds: 30

arceus:
  notification:
    # Where deployment.completed/failed/rolledback/cancelled outcomes get
    # emailed - see DomainEventConsumer. Not per-user, so it's a single
    # operator-configured mailbox rather than something read off the event.
    deployment-alert-email: ${DEPLOYMENT_ALERT_EMAIL:deploy-alerts@arceus.local}

    internal:
      # Shared secret scheduler-service's HTTP_CALLBACK executor presents
      # as ?token= when it POSTs to /internal/notifications/retry-failed -
      # see RetryCallbackController / RetryJobRegistrar.
      api-token: ${NOTIFICATION_INTERNAL_API_TOKEN:changeme-notification-internal-token}
      # Base URL scheduler-service's HTTP_CALLBACK executor uses to call
      # back into this service - must be reachable from scheduler-service's pod/host.
      callback-base-url: ${NOTIFICATION_CALLBACK_BASE_URL:http://localhost:8082}

    # x-internal-token this service must present when it calls
    # scheduler-service's gRPC API - see GrpcClientConfig. Must match
    # scheduler-service's own arceus.scheduler.internal.api-token exactly.
    grpc-clients:
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}
      feature-flag-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}

    feature-flags:
      # See featureflag.ChannelFlagGateService.
      environment: ${NOTIFICATION_FEATURE_FLAG_ENVIRONMENT:PRODUCTION}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 'metrics' + show-details below are what let monitoring-service's
        # ServiceHealthCollector/ServiceMetricsCollector see this service's
        # db/redis/rabbit component breakdown and JVM/CPU/request metrics.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      # Our own MailHealthIndicator (config package) replaces this with a
      # cached, non-blocking check - /actuator/health should never block on
      # a live SMTP connection to smtp.gmail.com. That live check was
      # routinely taking 1.5-3s, tripping monitoring-service's 2000ms poll
      # timeout, and falsely marking this service DOWN.
      enabled: false

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.notificationservice: ${LOG_LEVEL_NOTIFICATION_SERVICE:INFO}
