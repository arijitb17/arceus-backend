server:
  port: 8082

grpc:
  server:
    port: ${NOTIFICATION_GRPC_PORT:9082}

spring:
  autoconfigure:
    exclude:
      # See auth-service's application.yml for why: Spring Security here is
      # for the REST layer only, not gRPC.
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${NOTIFICATION_DB_NAME:arceus_notification}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # fine for pre-release dev; move to Flyway + validate before v1.0.0
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

otp:
  expiration-minutes: 5

sms:
  twofactor:
    api-key: ${TWOFACTOR_API_KEY}
    base-url: https://2factor.in/API/V1

notification:
  # Retry policy for the generic /notifications pipeline (separate from the
  # best-effort OTP consumer above, which has no retry yet).
  max-attempts: 5
  retry-backoff-seconds: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        # 'metrics' + show-details below are what let monitoring-service's
        # ServiceHealthCollector/ServiceMetricsCollector see this service's
        # db/redis/rabbit component breakdown and JVM/CPU/request metrics.
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.notificationservice: ${LOG_LEVEL_NOTIFICATION_SERVICE:INFO}
