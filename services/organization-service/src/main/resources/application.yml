server:
  port: 8091

grpc:
  server:
    port: ${ORGANIZATION_GRPC_PORT:9090}
  client:
    # Used by SdkConfigService to get a project's PUBLIC API key on demand
    # when generating SDK config (architecture design §9), and by
    # ModuleEnablementService to call AuthTenantProvisioningService directly
    # (see that class's updated javadoc for why organization-service now
    # orchestrates provisioning itself instead of going through
    # deployment-service's event pipeline).
    auth:
      address: static://${AUTH_GRPC_HOST:localhost}:${AUTH_GRPC_PORT:9081}
      negotiation-type: plaintext
    notification:
      address: static://${NOTIFICATION_GRPC_HOST:localhost}:${NOTIFICATION_GRPC_PORT:9082}
      negotiation-type: plaintext
    cache:
      address: static://${CACHE_GRPC_HOST:localhost}:${CACHE_GRPC_PORT:9085}
      negotiation-type: plaintext
    scheduler:
      address: static://${SCHEDULER_GRPC_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: organization-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${ORGANIZATION_DB_NAME:arceus_organization}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # fine for pre-release dev; move to Flyway + validate before v1.0.0
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

# AES-256 key (32 raw bytes, base64-encoded) used to encrypt every Secret
# row - see SecretCryptoService's javadoc. Generate with:
#   openssl rand -base64 32
# Must be supplied via env var in every real environment; the fallback
# below is dev-only and intentionally obviously-a-placeholder.
arceus:
  organization:
    secrets:
      kek: ${ORGANIZATION_SECRETS_KEK:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    # The Gateway's own public-facing base URL - handed to developers in
    # generated SDK config (architecture design §9) as the endpoint their
    # SDK talks to. Not auto-discovered: this is a deployment-time constant,
    # the same way a frontend app's own API base URL is normally configured.
    gateway-base-url: ${ARCEUS_GATEWAY_BASE_URL:http://localhost:8090}
    # x-internal-token this service must present when calling
    # scheduler-service/feature-flag-service's gRPC API (their
    # GrpcAuthInterceptor is global, same reasoning as gateway-service's
    # own grpc-clients block). auth/notification/cache trust the caller's
    # network boundary and need no token - see ModuleProvisioningClient.
    grpc-clients:
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}
      feature-flag-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.organizationservice: ${LOG_LEVEL_ORGANIZATION_SERVICE:INFO}
