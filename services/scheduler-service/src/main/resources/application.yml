server:
  port: 8086

grpc:
  server:
    port: ${SCHEDULER_GRPC_PORT:9086}
  client:
    feature-flag:
      address: static://${FEATURE_FLAG_GRPC_HOST:localhost}:${FEATURE_FLAG_GRPC_PORT:9087}
      negotiation-type: plaintext

spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration

  application:
    name: scheduler-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${SCHEDULER_DB_NAME:arceus_scheduler}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
          max-attempts: 5
        default-requeue-rejected: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

arceus:
  scheduler:
    feature-flags:
      environment: ${SCHEDULER_FEATURE_FLAG_ENVIRONMENT:PRODUCTION}
    grpc-clients:
      feature-flag-token: ${FEATURE_FLAG_INTERNAL_API_TOKEN:changeme-feature-flag-internal-token}
    poll:
      interval-ms: ${SCHEDULER_POLL_INTERVAL_MS:1000}
      batch-size: ${SCHEDULER_POLL_BATCH_SIZE:50}
      expiry-interval-ms: ${SCHEDULER_EXPIRY_INTERVAL_MS:60000}

    worker:
      core-pool-size: ${SCHEDULER_WORKER_CORE_POOL_SIZE:10}
      max-pool-size: ${SCHEDULER_WORKER_MAX_POOL_SIZE:50}
      queue-capacity: ${SCHEDULER_WORKER_QUEUE_CAPACITY:500}

    retry:
      max-retries: ${SCHEDULER_DEFAULT_MAX_RETRIES:3}
      retry-delay-ms: ${SCHEDULER_DEFAULT_RETRY_DELAY_MS:30000}
      backoff-multiplier: ${SCHEDULER_DEFAULT_BACKOFF_MULTIPLIER:2.0}
      exponential-backoff-default: ${SCHEDULER_DEFAULT_EXPONENTIAL_BACKOFF:true}
      max-backoff-ms: ${SCHEDULER_MAX_BACKOFF_MS:1800000}

    callback:
      connect-timeout-ms: ${SCHEDULER_CALLBACK_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${SCHEDULER_CALLBACK_READ_TIMEOUT_MS:10000}

    delay:
      enabled: ${SCHEDULER_DELAY_NUDGE_ENABLED:true}
      max-delay-ms: ${SCHEDULER_DELAY_NUDGE_MAX_MS:3600000}

    internal:
      api-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.schedulerservice: ${LOG_LEVEL_SCHEDULER_SERVICE:INFO}
