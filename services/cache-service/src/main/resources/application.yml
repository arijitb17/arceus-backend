server:
  port: 8085

grpc:
  server:
    port: ${CACHE_GRPC_PORT:9085}
  client:
    scheduler:
      address: static://${SCHEDULER_HOST:localhost}:${SCHEDULER_GRPC_PORT:9086}
      negotiation-type: plaintext

spring:

  application:
    name: cache-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

arceus:
  cache:
    pool:
      max-active: ${CACHE_POOL_MAX_ACTIVE:16}
      max-idle: ${CACHE_POOL_MAX_IDLE:8}
      min-idle: ${CACHE_POOL_MIN_IDLE:0}
      max-wait-millis: ${CACHE_POOL_MAX_WAIT_MS:2000}

    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:3600}

    default-serialization: ${CACHE_DEFAULT_SERIALIZATION:JSON}

    max-object-size-bytes: ${CACHE_MAX_OBJECT_SIZE_BYTES:5242880}

    compression:
      enabled: ${CACHE_COMPRESSION_ENABLED:true}
      auto-threshold-bytes: ${CACHE_COMPRESSION_AUTO_THRESHOLD_BYTES:8192}

    namespaces:
      allowed:
        - auth
        - session
        - otp
        - user
        - notification
        - ratelimit
        - featureflag
        - demo
      allow-unlisted: ${CACHE_ALLOW_UNLISTED_NAMESPACES:false}

    sweep:
      no-expiry-stale-after-seconds: ${CACHE_SWEEP_NO_EXPIRY_STALE_AFTER_SECONDS:2592000}

    internal:
      api-token: ${CACHE_INTERNAL_API_TOKEN:changeme-cache-internal-token}
      callback-base-url: ${CACHE_CALLBACK_BASE_URL:http://localhost:8085}

    scheduling:
      sweep-interval-ms: ${CACHE_SWEEP_INTERVAL_MS:86400000}
      scheduler-token: ${SCHEDULER_INTERNAL_API_TOKEN:changeme-scheduler-internal-token}

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.cacheservice: ${LOG_LEVEL_CACHE_SERVICE:INFO}
