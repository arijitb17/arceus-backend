server:
  port: 8084

grpc:
  server:
    port: ${RATELIMIT_GRPC_PORT:9084}

spring:

  application:
    name: ratelimit-service

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.arijit.ratelimitservice: ${LOG_LEVEL_RATELIMIT_SERVICE:INFO}
