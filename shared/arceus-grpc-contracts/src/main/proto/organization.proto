syntax = "proto3";

package arceus.organization;

option java_package = "com.arijit.arceus.grpc.organization";
option java_multiple_files = true;
option java_outer_classname = "OrganizationProto";

import "gateway.proto";

message CheckManagerAccessRequest {
  string organization_id = 1;
  string user_email = 2;
}

message CheckManagerAccessResponse {
  bool authorized = 1;
  string role = 2;
}

message CheckMemberAccessResponse {
  bool authorized = 1;
  string role = 2;
}

message CheckProjectExistsRequest {
  string organization_id = 1;
  string project_id = 2;
}

message CheckProjectExistsResponse {
  bool exists = 1;
}

message GetTrackedBranchesRequest {
  string project_id = 1;
}

message TrackedBranch {
  string environment = 1;
  string branch = 2;
}

message GetTrackedBranchesResponse {
  repeated TrackedBranch branches = 1;
}

service OrganizationAccessGrpcService {
  rpc CheckManagerAccess(CheckManagerAccessRequest) returns (CheckManagerAccessResponse);
  rpc CheckMemberAccess(CheckManagerAccessRequest) returns (CheckMemberAccessResponse);
  rpc CheckProjectExists(CheckProjectExistsRequest) returns (CheckProjectExistsResponse);
  rpc GetTrackedBranches(GetTrackedBranchesRequest) returns (GetTrackedBranchesResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}
