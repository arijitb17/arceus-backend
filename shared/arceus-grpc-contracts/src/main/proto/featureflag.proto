syntax = "proto3";

package arceus.featureflag;

option java_package = "com.arijit.arceus.grpc.featureflag";
option java_multiple_files = true;
option java_outer_classname = "FeatureFlagProto";

import "gateway.proto";

message Flag {
  string id = 1;
  string key = 2;
  string name = 3;
  string description = 4;
  string flag_type = 5;
  string environment = 6;
  string target_type = 7;
  string value = 8;
  string status = 9;
  int32 rollout_percentage = 10;
  int64 activate_at_epoch_millis = 11;
  int64 deactivate_at_epoch_millis = 12;
  string created_by = 13;
  string updated_by = 14;
  int64 created_at_epoch_millis = 15;
  int64 updated_at_epoch_millis = 16;
  int64 version = 17;
}

message CreateFlagRequest {
  string key = 1;
  string name = 2;
  string description = 3;
  string flag_type = 4;
  string environment = 5;
  string target_type = 6;
  string value = 7;
  int32 rollout_percentage = 8;
  int64 activate_at_epoch_millis = 9;
  int64 deactivate_at_epoch_millis = 10;
  string actor = 11;
}

message UpdateFlagRequest {
  string key = 1;
  string environment = 2;
  string name = 3;
  string description = 4;
  string value = 5;
  int32 rollout_percentage = 6;
  int64 activate_at_epoch_millis = 7;
  int64 deactivate_at_epoch_millis = 8;
  string actor = 9;
}

message DeleteFlagRequest {
  string key = 1;
  string environment = 2;
  string actor = 3;
}

message FlagIdentifier {
  string key = 1;
  string environment = 2;
}

message EnableFlagRequest {
  string key = 1;
  string environment = 2;
  string actor = 3;
}

message GetFlagResponse {
  bool found = 1;
  Flag flag = 2;
}

message ListFlagsRequest {
  string environment = 1;
  string status = 2;
  int32 page = 3;
  int32 size = 4;
}

message ListFlagsResponse {
  repeated Flag flags = 1;
  int64 total_elements = 2;
  int32 total_pages = 3;
  int32 page = 4;
  int32 size = 5;
}

message FlagActionResponse {
  bool success = 1;
  string message = 2;
  Flag flag = 3;
}

message EvaluateFlagRequest {
  string key = 1;
  string environment = 2;
  string bucket_key = 3;
  string default_value = 4;
}

message EvaluateFlagResponse {
  bool found = 1;
  bool enabled = 2;
  string value = 3;
  string flag_type = 4;
  bool from_cache = 5;
}

service FeatureFlagGrpcService {
  rpc CreateFlag(CreateFlagRequest) returns (FlagActionResponse);
  rpc UpdateFlag(UpdateFlagRequest) returns (FlagActionResponse);
  rpc DeleteFlag(DeleteFlagRequest) returns (FlagActionResponse);
  rpc GetFlag(FlagIdentifier) returns (GetFlagResponse);
  rpc ListFlags(ListFlagsRequest) returns (ListFlagsResponse);
  rpc EvaluateFlag(EvaluateFlagRequest) returns (EvaluateFlagResponse);
  rpc EnableFlag(EnableFlagRequest) returns (FlagActionResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}
