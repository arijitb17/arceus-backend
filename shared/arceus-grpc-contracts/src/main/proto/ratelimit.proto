syntax = "proto3";

package arceus.ratelimit;

option java_package = "com.arijit.arceus.grpc.ratelimit";
option java_multiple_files = true;
option java_outer_classname = "RateLimitProto";

import "gateway.proto";

message RateLimitCheckRequest {
  string key = 1;
  string algorithm = 2;
  int32 limit = 3;
  int32 window_seconds = 4;
  int32 capacity = 5;
  double refill_per_second = 6;
}

message RateLimitCheckResponse {
  bool allowed = 1;
  int64 remaining_requests = 2;
  int64 retry_after = 3;
}

service RateLimitGrpcService {
  rpc Check(RateLimitCheckRequest) returns (RateLimitCheckResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}
