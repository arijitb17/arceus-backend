syntax = "proto3";

package arceus.tenant;

option java_package = "com.arijit.arceus.grpc.tenant";
option java_multiple_files = true;
option java_outer_classname = "TenantProvisioningProto";

import "gateway.proto";

message ProvisionTenantRequest {
  string project_id = 1;
  string environment = 2;
  string requested_by = 3;
}

message ProvisionTenantResponse {
  bool success = 1;
  string message = 2;
  string resource_reference = 3;
}

message DeprovisionTenantRequest {
  string project_id = 1;
  string environment = 2;
  string requested_by = 3;
}

message DeprovisionTenantResponse {
  bool success = 1;
  string message = 2;
}

service AuthTenantProvisioningService {
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);
  rpc DeprovisionTenant(DeprovisionTenantRequest) returns (DeprovisionTenantResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}

service NotificationTenantProvisioningService {
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);
  rpc DeprovisionTenant(DeprovisionTenantRequest) returns (DeprovisionTenantResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}

service CacheTenantProvisioningService {
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);
  rpc DeprovisionTenant(DeprovisionTenantRequest) returns (DeprovisionTenantResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}

service SchedulerTenantProvisioningService {
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);
  rpc DeprovisionTenant(DeprovisionTenantRequest) returns (DeprovisionTenantResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}

service FeatureFlagTenantProvisioningService {
  rpc ProvisionTenant(ProvisionTenantRequest) returns (ProvisionTenantResponse);
  rpc DeprovisionTenant(DeprovisionTenantRequest) returns (DeprovisionTenantResponse);
  rpc Ping(arceus.gateway.PingRequest) returns (arceus.gateway.PingResponse);
}
